name: Deploy to CloudPanel

on:
  push:
    branches:
      - main # O deploy vai rodar quando você fizer push nesta branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Entra na pasta do seu site
            cd htdocs/live.paginasturbinadas.com.br
            
            # Verifica se já é um repositório git. Se não for, inicializa usando o TOKEN automático do GitHub para repositórios privados
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch
              git reset --hard origin/main
            else
              # Se já for, atualiza a URL para garantir que usa o token e puxa o código forçadamente
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git reset --hard origin/main
            fi
            
            # Instala o backend e reinicia o PM2
            cd backend-engine
            npm install
            pm2 restart tiktok-backend || pm2 start server.js --name "tiktok-backend"
            
            # Instala e compila o frontend (Painel Web) apontando para o domínio oficial
            cd ../web-dashboard
            npm install
            VITE_API_URL=https://live.paginasturbinadas.com.br npm run build
            
            # Copia os arquivos compilados do painel para a pasta raiz do site (para o Nginx ler)
            cp -r dist/* ../